[package]
name = "ulai-core"
description = "ULAI core library: probes, manifest, parsing, policy model"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Exposes `testing::FakeHost` to other crates' tests.
test-support = ["dep:tempfile"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

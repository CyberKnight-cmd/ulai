# SPDX-FileCopyrightText: 2026 The ULAI contributors
#
# SPDX-License-Identifier: GPL-3.0-or-later

# Licensing for files that cannot carry a comment header (JSON, golden
# snapshots that must stay byte-exact, generated lock files) and for the
# documentation. See ADR-012.
version = 1

[[annotations]]
path = [
  "*.md",
  "docs/**",
  "Cargo.lock",
  "fuzz/Cargo.lock",
  "tools/ulai-sop/Cargo.lock",
  "crates/ulai-core/tests/snapshots/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ULAI contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# ADR-015: the format documents are CC-BY-4.0 so that other projects can
# implement the format. These override the GPL default above.
[[annotations]]
path = ["docs/SPEC.md", "docs/doctor-schema.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The ULAI contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# ADR-015: JSON Schemas are MIT.
[[annotations]]
path = ["schemas/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The ULAI contributors"
SPDX-License-Identifier = "MIT"

# Test fixtures made for ULAI (keys, signatures, expected outcomes): CC0-1.0.
[[annotations]]
path = ["tests/fixtures/openpgp/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ULAI contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["tests/fixtures/appimage/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ULAI contributors"
SPDX-License-Identifier = "CC0-1.0"

# Signed AppImage fixtures (tests/fixtures/appimage/README.md): an AppImage
# runtime (MIT, statically linking musl, libfuse, squashfuse, libzstd and
# zlib) followed by CC0 content written for ULAI.
[[annotations]]
path = ["tests/fixtures/appimage/*.AppImage"]
precedence = "override"
SPDX-FileCopyrightText = ["2004-2025 Simon Peter, probonopd and the AppImage Team (runtime)", "2026 The ULAI contributors (content)"]
SPDX-License-Identifier = "MIT AND LGPL-2.1-only AND BSD-2-Clause AND (BSD-3-Clause OR GPL-2.0-only) AND Zlib AND CC0-1.0"

# RFC 9580 Appendix A test vectors, copied verbatim. RFC boilerplate:
# Code Components are under the Revised BSD licence (TLP section 4.e).
[[annotations]]
path = ["tests/fixtures/openpgp/rfc9580/**"]
precedence = "override"
SPDX-FileCopyrightText = "2024 IETF Trust and the persons identified as the document authors"
SPDX-License-Identifier = "BSD-3-Clause"


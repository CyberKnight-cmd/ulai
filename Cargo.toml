[workspace]
resolver = "3"
members = ["crates/ulai-core", "crates/ulai-cli", "crates/ulai-run"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/CyberKnight-cmd/ulai"

[workspace.dependencies]
ulai-core = { path = "crates/ulai-core" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
# `unwind`, not `abort`: doctor isolates failing probes with catch_unwind.
panic = "unwind"
